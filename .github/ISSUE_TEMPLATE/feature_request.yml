name: 功能建议 / Feature request
description: 提一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 你现在怎么处理？哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 工具名、参数、输入输出格式尽量具体。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能不需要联网 / 不上传数据（本项目保持纯本地）
          required: true
        - label: 该功能不依赖视觉大模型（读图理解交给上层 Agent）
          required: true
